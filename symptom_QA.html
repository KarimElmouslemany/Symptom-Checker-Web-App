<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tailwind.css" />
    <script src="checker.js" defer></script>
    <title>Symptom Checker</title>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <nav
      aria-label="Main navigation"
      class="flex items-center justify-between border-b bg-white px-6 py-2 text-sm"
    >
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold">Symptom Checker</h1>
      </div>
      <ul class="flex gap-6">
        <li>
          <a
            href="main.html"
            class="text-black underline hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-800 rounded px-1"
            >A-Z List</a
          >
        </li>
        <li>
          <a
            href="login.html"
            class="text-black underline hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-800 rounded px-1"
            >Sign Out</a
          >
        </li>
      </ul>
    </nav>
    <main class="mx-auto max-w-2xl px-4 py-6">
      <!-- Step 1: Body part selection -->
      <div id="step1">
        <h2 class="text-lg font-semibold mb-4">Where is your symptom?</h2>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <button
            type="button"
            onclick="selectBodyPart('head')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Head
          </button>
          <button
            type="button"
            onclick="selectBodyPart('chest')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Chest
          </button>
          <button
            type="button"
            onclick="selectBodyPart('stomach')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Stomach
          </button>
          <button
            type="button"
            onclick="selectBodyPart('back')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Back
          </button>
          <button
            type="button"
            onclick="selectBodyPart('arms')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Arms
          </button>
          <button
            type="button"
            onclick="selectBodyPart('legs')"
            class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-600"
          >
            Legs
          </button>
        </div>
      </div>

      <!-- Step 2: Symptom questions -->
      <div id="step2" class="hidden">
        <h2 class="text-lg font-semibold mb-4">
          Do you have any of these symptoms?
        </h2>
        <div id="questions" class="grid gap-4"></div>
        <button
          id="getRecommendation"
          onclick="getRecommendation()"
          class="cursor-pointer mt-6 bg-blue-950 text-white px-6 py-2 rounded-xl hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-800 transition"
        >
          Check Symptoms
        </button>
      </div>

      <!-- Step 3: Recommendation -->
      <div id="step3" class="hidden">
        <h2 class="text-lg font-semibold mb-4">Recommended Action</h2>
        <div
          id="result"
          class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
          aria-live="polite"
        ></div>
      </div>
      <button
        type="button"
        id="restart_button"
        onclick="restart()"
        class="cursor-pointer mt-6 border border-slate-200 px-6 py-2 rounded-xl hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-800 transition hidden"
      >
        Start Again
      </button>
    </main>
  </body>
</html>
