<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind compiled CSS -->
    <link rel="stylesheet" href="tailwind.css" />

    <!-- Keep your JS exactly the same -->
    <script src="interaction.js" defer></script>
    <script src="AI.js" defer></script>

    <title>Symptom Checker</title>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <!-- Same nav structure -->
    <nav class="flex justify-end gap-6 border-b bg-white px-6 py-4 text-sm">
      <ul>
        <a href="login.html" class="text-slate-600 hover:text-slate-900">
          Sign Out
        </a>
      </ul>
      <ul></ul>
    </nav>

    <!-- SAME structure -->
    <div id="outer_div" class="mx-auto max-w-6xl px-4 py-6">
      <div
        id="symptoms1"
        class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
    </div>

    <!-- Chat Toggle Button -->
    <button
      id="chat_toggle"
      onclick="toggleChat()"
      class="fixed bottom-6 right-6 w-13 h-13 rounded-full bg-blue-950 text-white text-2xl flex items-center justify-center shadow-lg hover:bg-blue-900 transition z-50"
    >
      💬
    </button>

    <!-- Chat Box -->
    <div
      id="chat_box"
      class="fixed bottom-24 right-6 w-80 rounded-2xl border border-slate-200 bg-white flex flex-col overflow-hidden z-50 shadow-lg"
    >
      <!-- Header -->
      <div
        class="bg-blue-950 text-white px-4 py-3 flex items-center justify-between"
      >
        <span class="text-sm font-bold">Symptom Assistant</span>
        <button
          onclick="toggleChat()"
          class="text-white text-lg hover:opacity-75 transition"
        >
          ✕
        </button>
      </div>

      <!-- Messages -->
      <div
        id="chat_messages"
        class="h-72 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50"
      >
        <p
          id="chat_welcome"
          class="self-start bg-white border border-slate-200 text-slate-900 text-sm rounded-xl rounded-bl-sm px-3 py-2 max-w-4/5"
        >
          Hi! Ask me about your symptoms.
        </p>
      </div>

      <!-- Input -->
      <div class="flex gap-2 p-3 border-t border-slate-200 bg-white">
        <input
          id="chat_input"
          type="text"
          placeholder="Describe your symptoms..."
          class="flex-1 text-sm px-3 py-2 rounded-lg border border-slate-200 outline-none focus:outline-blue-800 text-slate-900"
        />

        <button
          id="chat_send"
          class="px-4 py-2 bg-blue-950 text-white text-sm font-bold rounded-lg hover:bg-blue-900 transition"
        >
          Send
        </button>
      </div>
      <p
        class="text-center text-xs text-slate-600 px-3 py-2 border-t border-slate-200 bg-white"
      >
        This is not a substitute for professional medical advice.
      </p>
    </div>
  </body>
</html>
