<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tailwind.css" />
    <script src="DisplaySymptomes.js" defer></script>
    <script src="AI_frontend.js" defer></script>
    <script type="module" src="singout.js" defer></script>
    <!--module is need to allow import to work and only the js file can access the varaibles and functions-->
    <title>Symptom Checker A-Z List</title>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <h1 class="sr-only">Symptom Checker A-Z List</h1>
    <nav
      aria-label="Main navigation"
      class="flex justify-end gap-6 border-b bg-white px-6 py-4 text-sm"
    >
      <ul class="flex gap-6">
        <li>
          <button
            type="button"
            class="singout_button cursor-pointer text-black underline hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-800 rounded px-1"
          >
            Sign Out
          </button>
        </li>
        <li>
          <a
            href="symptom_QA.html"
            class="cursor-pointer text-black underline hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-800 rounded px-1"
            >QA symptoms</a
          >
        </li>
      </ul>
    </nav>
    <main id="main-content">
      <div
        id="Display_info"
        class="grid gap-6 mx-auto max-w-6xl px-4 py-6 sm:grid-cols-2 lg:grid-cols-3"
      ></div>

      <!-- Chat Toggle Button -->
      <button
        id="chat_toggle"
        type="button"
        aria-label="Open symptom assistant chat"
        aria-controls="chat_box"
        aria-expanded="false"
        onclick="toggleChat()"
        class="fixed bottom-6 right-6 w-13 h-13 rounded-full bg-blue-950 text-white text-2xl flex items-center justify-center shadow-lg hover:bg-blue-900 transition z-50 focus:outline-none focus:ring-2 focus:ring-blue-800"
      >
        <span aria-hidden="true">💬</span>
      </button>

      <!-- Chat Box -->
      <div
        id="chat_box"
        role="region"
        aria-label="Symptom assistant chat"
        aria-describedby="chat_disclaimer"
        class="fixed bottom-24 right-6 w-80 rounded-2xl border border-slate-200 bg-white flex flex-col overflow-hidden z-50 shadow-lg"
      >
        <!-- Header -->
        <div
          class="bg-blue-950 text-white px-4 py-3 flex items-center justify-between"
        >
          <span class="text-sm font-bold">Symptom Assistant</span>
          <button
            type="button"
            aria-label="Close symptom assistant chat"
            onclick="toggleChat()"
            class="text-white text-lg hover:opacity-75 transition focus:outline-none focus:ring-2 focus:ring-white rounded"
          >
            <span aria-hidden="true">✕</span>
          </button>
        </div>

        <!-- Messages -->
        <div
          id="chat_messages"
          role="log"
          aria-live="polite"
          aria-label="Conversation with the symptom assistant"
          class="h-72 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50"
        >
          <p
            id="chat_welcome"
            class="self-start border bg-emerald-700 text-white text-sm rounded-xl rounded-bl-sm px-3 py-2 max-w-4/5"
          >
            Hi! Ask me about your symptoms.
          </p>
        </div>

        <!-- Input -->
        <div
          class="flex items-center gap-4 px-4 py-3 border-t border-slate-200 bg-white"
        >
          <label for="chat_input" class="sr-only">
            Type your symptoms or question for the symptom assistant
          </label>
          <input
            id="chat_input"
            type="text"
            placeholder="Describe your symptoms..."
            class="flex-1 text-sm px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-800 text-slate-900"
          />

          <button
            id="chat_send"
            type="button"
            class="px-4 py-2 bg-blue-950 text-white text-sm font-bold rounded-lg hover:bg-blue-900 transition focus:outline-none focus:ring-2 focus:ring-blue-800"
          >
            Send
          </button>
        </div>
        <p
          id="chat_disclaimer"
          class="text-center text-xs text-slate-600 px-3 py-2 border-t border-slate-200 bg-white"
        >
          This is not a substitute for professional medical advice.
        </p>
      </div>
    </main>
  </body>
</html>
