<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styling.css" />
    <title>sign up</title>
    <script type="module" src="singup.js"></script>
  </head>
  <body>
    <nav>
      <ul>
        <a href="Sign_Up.html">sign up</a>
      </ul>
      <ul>
        <a href="login.html">login</a>
      </ul>
    </nav>
    <form class="forms_login_signup" id="signup_form">
      <h3 id="heading_singup">Sign Up</h3>
      <div id="signup_username" class="username">
        <label for="signup_email" class="input_lables"
          >Enter your username</label
        >
        <input
          id="signup_email"
          type="email"
          placeholder="enter your username"
          required
        />
      </div>

      <div id="signup_password" class="password">
        <label for="signup_password" class="input_lables"
          >Enter your password</label
        >
        <input
          id="signup_password"
          type="password"
          placeholder="password"
          required
        />
      </div>
      <button id="user_button" type="submit">Enter</button>
    </form>
  </body>
</html>
